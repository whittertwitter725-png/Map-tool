<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardinal book store</title>
    <!-- This style tag is used to format the reference page itself to make it readable. -->
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
            line-height: 1.6;
            background-color: #ffffff;
            color: #111;
            max-width: 800px;
            margin: 20px auto;
            padding: 0 20px;
			  }
        h1, h2, h3 {
            border-bottom: 1px solid #ccc;
            padding-bottom: 5px;
            font-weight: 600;
        }
        h1 {
            font-size: 2em;
        }
        h2 {
            font-size: 1.5em;
            margin-top: 30px;
        }
        h3 {
            font-size: 1.2em;
            margin-top: 25px;
            border-bottom: none;
            font-weight: 600;
        }
        /* This 'code' style is for inline tag examples */
        code {
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace;
            background-color: #f4f4f4;
            padding: 2px 5px;
            border-radius: 4px;
            font-size: 0.9em;
        }
        /* This 'pre' style is for multi-line code blocks */
        pre {
            background-color: #f4f4f4;
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace;

        }

</head>
